# Run PHPCS, PHPStan, and PHPUnit in a single job, building assets first.
#
# For block plugins whose tests render through do_blocks(). Block registration
# reads block.json from the build directory rather than from source, so the
# block tests render nothing unless the assets are built before PHPUnit runs.
#
# This file is managed in https://github.com/happyprime/projects
name: PHP checks

on:
  push:
    branches:
      - trunk
      - develop
  pull_request:
    branches:
      - trunk
      - develop

# The consolidated workflow comments on the pull request when a project is
# configured for a check it cannot run. A workflow level permissions block caps
# what a reusable workflow receives, so the write scope is granted here.
permissions:
  contents: read
  pull-requests: write

jobs:
  call-workflow:
    uses: happyprime/workflows/.github/workflows/php-checks.yml@trunk
    with:
      php-version: '8.4'
      wp-versions: 'latest trunk'
      build-command: 'npm run build'
      node-version: 24
    secrets:
      composer-auth-token: ${{ secrets.COMPOSER_AUTH_TOKEN }}
