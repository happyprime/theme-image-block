# Run the Playwright end-to-end suite against a wp-env WordPress.
#
# Not synced from https://github.com/happyprime/projects: there is no shared
# e2e workflow, and the wp-env bootstrap here is specific to this plugin.
#
# Playwright's global setup starts wp-env when nothing answers on the
# configured port and stops it again in teardown, so there is no env step.
name: E2E tests

# Once a day against trunk rather than on every pull request: a cold wp-env
# start dominates the runtime. Run it by hand from the Actions tab before a
# release, and locally with `npm run test:e2e`.
#
# A scheduled workflow only runs on the default branch, and GitHub disables
# the schedule after 60 days without repository activity.
on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (Node 24)
    runs-on: ubuntu-latest
    # wp-env pulls WordPress and the Docker images on a cold runner. The cap
    # is a runaway guard; the suite itself runs in under a minute.
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # The plugin loads its classes through the committed production
      # autoloader. Regenerating it here means a commit that changed src/
      # without refreshing vendor/ is still tested as it would ship.
      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      # blocks/build is committed, but building here means a commit that
      # changed a block without refreshing the build is still tested.
      - name: Build blocks
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      # Traces and screenshots are retained on failure (see
      # playwright.config.ts), the only time there is anything to read here.
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
